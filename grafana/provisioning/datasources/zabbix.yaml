apiVersion: 1
datasources:
  - name: Zabbix
    uid: zabbix
    type: alexanderzobnin-zabbix-datasource
    access: proxy
    url: http://localhost/zabbix/api_jsonrpc.php
    isDefault: false
    editable: false
    jsonData:
      username: grafana
      trends: true
      trendsFrom: '7d'
      trendsRange: '4d'
      cacheTTL: '1m'
    secureJsonData:
      password: CHANGE_ME_DURING_INSTALL
