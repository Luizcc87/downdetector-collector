# Config de exemplo para o modulo mikrotik/ -- teste de link WAN por rota.
#
# Preencher host/username/password reais so depois que o servico api-ssl
# estiver habilitado e restrito por ACL em cada roteador (Ponto em Aberto 6.6
# da proposta). Ate la, este arquivo serve so de referencia de schema.
#
# routing_table: nome real do routing-mark/routing-table ja criado no
# Mikrotik pelo esquema de PBR (secao 2 da proposta). CONFIRMADO em campo
# em 2026-09-04 que o parametro do /ping/tool traceroute e sempre
# `routing-table=`, em v6 e v7 (ver mikrotik/config.py) -- so a sintaxe de
# CRIACAO da tabela em /ip route muda por branch, nao o nome usado aqui.
#
# ATENCAO -- os nomes dos marks NAO sao padronizados entre unidades:
#   Filial (v6, ja em producao, confirmado via API 2026-09-04): to_globoinfo / to_brphonia
#   Frigorifico (v7, ja em producao, conforme diagrama de topologia): to_globo / to_brphonia
#   Matriz: NAO CONFIRMADO -- nao presumir nenhum dos dois padroes acima
#   antes de verificar via API (Ponto em Aberto 6.10 da proposta).
#
# "__gateway__" nos targets: sentinela especial (ver mikrotik/config.py,
# GATEWAY_SENTINEL) -- o coletor resolve o IP do gateway ATUAL do link a
# cada ciclo, em vez de um IP fixo aqui. OBRIGATORIO para links PPPoE
# (GloboInfo nas 3 unidades): o gateway fica na faixa CGNAT 100.64.0.0/10,
# atribuido pelo provedor a cada negociacao PPPoE, pode mudar. Links com IP
# fixo por contrato (Brphonia Link Full, P2P) podem usar o IP literal --
# nao muda sozinho.

defaults:
  api_port: 8729
  use_ssl: true
  poll_interval: 90  # segundos -- ping curto, secao 4.4 da proposta

routers:
  - unit: filial
    host: 192.168.42.2  # gateway da ether5-LAN -- confirmado alcancavel via api-ssl em 2026-09-04
    branch: v6
    username: zabbix-probe
    password: "TROCAR_ANTES_DE_USAR"  # ver README -- nunca reutilizar entre unidades
    zabbix_host: "Mikrotik-Filial"
    links:
      - name: globoinfo
        routing_table: to_globoinfo  # confirmado via /ip route real em 2026-09-04 -- NAO "to_globo"
        targets:
          - "1.1.1.1"
          - "8.8.8.8"
          - "__gateway__"  # PPPoE -- resolvido em runtime (era 100.65.0.1 em 2026-09-04, CGNAT, pode mudar)
      - name: brphonia
        routing_table: to_brphonia  # confirmado via /ip route real em 2026-09-04
        targets:
          - "1.1.1.1"
          - "8.8.8.8"
          - "177.74.144.109"  # IP P2P fixo por contrato -- nao usa sentinela
      - name: starlink
        routing_table: to_star  # AINDA NAO EXISTE -- Starlink fora do WANGROUP (Fase 3 do roadmap); preencher so depois de criado
        targets:
          - "1.1.1.1"
          - "8.8.8.8"

  - unit: matriz
    host: 192.168.41.1  # confirmar IP real -- .rsc da Matriz ainda nao lido em detalhe (Ponto em Aberto 6.5)
    branch: v6
    username: zabbix-probe
    password: "TROCAR_ANTES_DE_USAR"
    zabbix_host: "Mikrotik-Matriz"
    links:
      - name: globoinfo
        routing_table: to_globoinfo  # NAO CONFIRMADO -- placeholder por analogia com a Filial, verificar antes de usar (Ponto em Aberto 6.10)
        targets:
          - "1.1.1.1"
          - "8.8.8.8"
          - "__gateway__"  # assumindo PPPoE tambem -- confirmar
      - name: brphonia
        routing_table: to_brphonia  # NAO CONFIRMADO -- idem acima
        targets:
          - "1.1.1.1"
          - "8.8.8.8"

  - unit: frigorifico
    host: 192.168.0.1  # gateway da ether3-Lan
    branch: v7
    username: zabbix-probe
    password: "TROCAR_ANTES_DE_USAR"
    zabbix_host: "Mikrotik-Frigorifico"
    links:
      - name: globoinfo
        routing_table: to_globo  # conforme diagrama de topologia do Frigorifico -- ainda nao confirmado via API como a Filial
        targets:
          - "1.1.1.1"
          - "8.8.8.8"
          - "__gateway__"  # PPPoE -- mesmo caso da Filial
      - name: brphonia
        routing_table: to_brphonia
        targets:
          - "1.1.1.1"
          - "8.8.8.8"
          - "138.94.76.236"  # IP P2P fixo documentado -- confirmar via API antes de usar
      - name: starlink
        routing_table: to_star  # AINDA NAO EXISTE -- Starlink fora do WAN list (Fase 3 do roadmap)
        targets:
          - "1.1.1.1"
          - "8.8.8.8"
