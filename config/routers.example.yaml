# Config de exemplo para o modulo mikrotik/ -- teste de link WAN por rota.
#
# Preencher host/username/password reais so depois que o servico api-ssl
# estiver habilitado e restrito por ACL em cada roteador (Ponto em Aberto 6.6
# da proposta). Ate la, este arquivo serve so de referencia de schema.
#
# routing_table: nome da tabela (v7, "to_<link>") ou routing-mark (v6) ja
# criado no Mikrotik pelo esquema de PBR (secao 2 da proposta). branch
# decide qual parametro de API usar -- ver mikrotik/config.py.

defaults:
  api_port: 8729
  use_ssl: true
  poll_interval: 90  # segundos -- ping curto, secao 4.4 da proposta

routers:
  - unit: filial
    host: 192.168.42.2  # gateway da ether5-LAN, IP interno -- confirmar antes de usar
    branch: v6
    username: zabbix-probe
    password: "TROCAR_ANTES_DE_USAR"
    zabbix_host: "Mikrotik-Filial"
    links:
      - name: globoinfo
        routing_table: to_globo
        targets:
          - "1.1.1.1"
          - "8.8.8.8"
          # gateway do ISP (1o hop) -- preencher com o gateway real do PPPoE
      - name: brphonia
        routing_table: to_brphonia
        targets:
          - "1.1.1.1"
          - "8.8.8.8"
          # gateway 177.74.144.109 (ver topologia da Filial) -- confirmar antes de usar
      - name: starlink
        routing_table: to_star
        targets:
          - "1.1.1.1"
          - "8.8.8.8"

  - unit: matriz
    host: 192.168.41.1  # confirmar IP real -- .rsc da Matriz ainda nao lido em detalhe (Ponto em Aberto 6.5)
    branch: v6
    username: zabbix-probe
    password: "TROCAR_ANTES_DE_USAR"
    zabbix_host: "Mikrotik-Matriz"
    links:
      - name: globoinfo
        routing_table: to_globo
        targets:
          - "1.1.1.1"
          - "8.8.8.8"
      - name: brphonia
        routing_table: to_brphonia
        targets:
          - "1.1.1.1"
          - "8.8.8.8"

  - unit: frigorifico
    host: 192.168.0.1  # gateway da ether3-Lan
    branch: v7
    username: zabbix-probe
    password: "TROCAR_ANTES_DE_USAR"
    zabbix_host: "Mikrotik-Frigorifico"
    links:
      - name: globoinfo
        routing_table: to_globo
        targets:
          - "1.1.1.1"
          - "8.8.8.8"
      - name: brphonia
        routing_table: to_brphonia
        targets:
          - "1.1.1.1"
          - "8.8.8.8"
          # gateway 138.94.76.236 -- confirmar antes de usar
      - name: starlink
        routing_table: to_star
        targets:
          - "1.1.1.1"
          - "8.8.8.8"
