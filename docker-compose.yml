name: downdetector

services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: dd-flaresolverr
    ports:
      - "8191:8191"
    environment:
      - LOG_LEVEL=info
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: dd-postgres
    environment:
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=zabbix
      - POSTGRES_DB=zabbix
    volumes:
      - dd-pg-data:/var/lib/postgresql/data
    restart: unless-stopped

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
    container_name: dd-zabbix-server
    ports:
      - "10052:10051"
    environment:
      - DB_SERVER_HOST=postgres
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=zabbix
      - POSTGRES_DB=zabbix
    depends_on:
      - postgres
    restart: unless-stopped

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
    container_name: dd-zabbix-web
    ports:
      - "8888:8080"
    environment:
      - DB_SERVER_HOST=postgres
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=zabbix
      - POSTGRES_DB=zabbix
      - ZBX_SERVER_HOST=zabbix-server
      - ZBX_SERVER_PORT=10051
      - PHP_TZ=America/Sao_Paulo
    depends_on:
      - zabbix-server
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: dd-grafana
    ports:
      - "3030:3000"
    environment:
      - GF_INSTALL_PLUGINS=alexanderzobnin-zabbix-app
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PANELS_DISABLE_SANITIZE_HTML=true
    volumes:
      - dd-grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana:/var/lib/grafana/dashboards/downdetector
      - ./grafana/logos:/usr/share/grafana/public/img/downdetector
    depends_on:
      - zabbix-web
    restart: unless-stopped

  collector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dd-collector
    depends_on:
      - flaresolverr
      - zabbix-server
    environment:
      - FLARESOLVERR_URL=http://flaresolverr:8191/v1
      - ZABBIX_SERVER=zabbix-server
      - ZABBIX_PORT=10051
    volumes:
      - ./config/services.example.yaml:/app/config/services.example.yaml
    restart: unless-stopped

volumes:
  dd-pg-data:
  dd-grafana-data:
