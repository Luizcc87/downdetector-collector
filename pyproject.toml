[project]
name = "downdetector-collector"
version = "0.1.0"
description = "Daemon Playwright que raspa Downdetector e envia ao Zabbix"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40",
    "playwright-stealth>=1.0.6",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "anyio>=4.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.scripts]
downdetector-collector = "collector.__main__:main"
downdetector-discover = "bin.discover:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
