zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 4c736133e41640a6944133645d20a2db
      name: Templates
  templates:
    - uuid: 8a8ccffebc3a44fb9bcde5cc8e90f4dd
      template: Template Downdetector
      name: Template Downdetector
      groups:
        - name: Templates
      items:
        - uuid: 3688848d1e864a53b5bf124fe6326939
          name: Scraper uptime
          key: downdetector.scraper.uptime
          type: TRAP
          value_type: FLOAT
          history: 7d
          trends: 90d
        - uuid: 8302c170165740a7ab446f189d4fb14e
          name: Last cycle duration
          key: downdetector.scraper.cycle_seconds
          type: TRAP
          value_type: FLOAT
          history: 7d
          trends: 90d
        - uuid: c91b08fc0f0147a1be39bb4639a77e49
          name: Cloudflare blocks (5m)
          key: downdetector.scraper.blocks_5m
          type: TRAP
          history: 7d
          trends: 90d
        - uuid: 4eb924c7cba644cb89030a00f12cdc94
          name: Browser restarts
          key: downdetector.scraper.restarts
          type: TRAP
          history: 7d
          trends: 90d
        - uuid: 9b8faa2c182246ef9ba8cd730a6d6958
          name: Scraper healthy
          key: downdetector.scraper.healthy
          type: TRAP
          history: 7d
          trends: 90d
      discovery_rules:
        - uuid: 1bc545714c87493ca9ff2ce65550844c
          name: Downdetector services
          type: EXTERNAL
          key: 'downdetector_discovery.py["/etc/downdetector-collector/services.yaml"]'
          delay: 5m
          item_prototypes:
            - uuid: d46fa81f50204efbaa4e06671036f9d6
              name: '{#NAME}: status'
              key: 'downdetector.status[{#SLUG}]'
              type: TRAP
              history: 90d
              trends: 365d
              valuemap:
                name: Downdetector Status
            - uuid: 2c83999769e74a1d8a5ac3071561dbb3
              name: '{#NAME}: reports last hour'
              key: 'downdetector.reports[{#SLUG}]'
              type: TRAP
              history: 90d
              trends: 365d
            - uuid: 5d3dfb61896b42b7aa244533f606dc10
              name: '{#NAME}: latency to official service'
              key: 'downdetector.latency_ms[{#SLUG}]'
              type: TRAP
              value_type: FLOAT
              units: ms
              history: 30d
              trends: 365d
            - uuid: 4d8bcd3924ee4ca096eb3dc15a924c94
              name: '{#NAME}: last successful check'
              key: 'downdetector.last_check[{#SLUG}]'
              type: TRAP
              history: 7d
            - uuid: f5163b636010470390ce5af7af5d753e
              name: '{#NAME}: service name'
              key: 'downdetector.name[{#SLUG}]'
              type: TRAP
              value_type: CHAR
              history: 365d
              trends: '0'
            - uuid: 446abfc6b104435bb0611bfd88ae38b3
              name: '{#NAME}: company id'
              key: 'downdetector.company_id[{#SLUG}]'
              type: TRAP
              history: 365d
            - uuid: 8e03e04a04a54e1889380f7954507151
              name: '{#NAME}: logo'
              key: 'downdetector.logo[{#SLUG}]'
              type: TRAP
              value_type: CHAR
              history: 365d
              trends: '0'
          trigger_prototypes:
            - uuid: 68486048e524493fb76620498e192416
              expression: 'last(/Template Downdetector/downdetector.status[{#SLUG}])=1'
              name: '[Atenção] {#NAME} reportando problemas leves'
              priority: WARNING
            - uuid: 5e3270db09524996b05235f19e71848d
              expression: 'last(/Template Downdetector/downdetector.status[{#SLUG}])=2'
              name: '[Problema] {#NAME} reportando falha grave'
              priority: HIGH
            - uuid: f69a14e797a64156bc8e29493957c138
              expression: '(now()-last(/Template Downdetector/downdetector.last_check[{#SLUG}]))>600'
              name: '[Stale] {#NAME} sem coleta há mais de 10min'
              priority: INFO
      valuemaps:
        - uuid: db8d2235d0d648d8adc2ff8d03bcdef5
          name: Downdetector Status
          mappings:
            - value: '0'
              newvalue: Ok
            - value: '1'
              newvalue: Atenção
            - value: '2'
              newvalue: Problema
            - value: '3'
              newvalue: Desconhecido
